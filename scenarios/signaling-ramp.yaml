name: signaling-ramp-300
description: Ramp signaling-only load to ${MAX_USERS:-300} users and hold, to find the join-latency knee.
target:
  url: ${BBB_URL}
  secret: ${BBB_SECRET}
  version: auto
meeting:
  count: ${MEETINGS:-4}
ramp:
  - { at: 0s, users: 10 }
  - { at: 120s, users: ${MAX_USERS:-300} }
  - { hold: 180s }
mix:
  signaling: { weight: 100 }
behaviour:
  chatMessagesPerMinute: 2
  raiseHandProbability: 0.05
slo:
  joinLatencyP95: 8s
